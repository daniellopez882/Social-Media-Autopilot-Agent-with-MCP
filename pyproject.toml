[project]
name = "socialpilot"
version = "0.2.0"
description = "A LangGraph workflow that drafts social content, holds it for human approval when it names a banned topic, and hands it to scheduling."
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".venv312", "social_media_prompts.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "TID", "RUF"]
ignore = [
    "S101",  # assert: the test suite, and one module-level consistency check
    "B008",  # function call in a default argument: FastAPI Depends()/Path() idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["app", "social_media_prompts"]
